; Victim config: "modern recommended" session settings.
; session.serialize_handler=php_serialize is the PHP-documented recommendation
; (avoids key-length limits); legacy code paths still read with handler=php.
session.serialize_handler = php_serialize
session.save_path = /var/www/sess
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.use_strict_mode = On
display_errors = Off
log_errors = On
