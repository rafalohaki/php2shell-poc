; CASE-009 / T3: ALL-STOCK session config. Difference from victim/:
; cleanup=On (the DEFAULT) and default min_freq — no "lab-friendly" setting.
session.serialize_handler = php_serialize
session.save_path = /var/www/sess
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
session.use_strict_mode = On
display_errors = Off
log_errors = On
